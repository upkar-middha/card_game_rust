<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPADER-MAN♠</title>
    <link rel="icon" href="/assets/favicon.ico"/>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<div id="app">

    <!-- ================================================= -->
    <!--                  CONNECT SCREEN                    -->
    <!-- ================================================= -->
    <div id="screen-connect" class="screen active">

        <div class="window">

            <div class="logo">♠</div>

            <h1 class="title">SPADER-MAN♠</h1>

            <p class="subtitle">
                Multiplayer Card Game
            </p>

            <!-- Name -->
            <div class="section">

                <label for="nameInput">
                    Player Name
                </label>

                <div class="row">

                    <input
                        type="text"
                        id="nameInput"
                        placeholder="Enter your name"
                        maxlength="16"
                        autocomplete="off"
                    >

                    <button id="setNameBtn">
                        Set Name
                    </button>

                </div>

            </div>

            <!-- Room Controls -->
            <div class="section">

                <button
                    id="createRoomBtn"
                    disabled
                >
                    Create Room
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="row">

                    <input
                        type="number"
                        id="roomIdInput"
                        placeholder="Room ID"
                    >

                    <button
                        id="joinRoomBtn"
                        disabled
                    >
                        Join Room
                    </button>

                </div>

            </div>

            <!-- Status -->
            <div
                id="connectStatus"
                class="status"
            >
                Connecting to server...
            </div>

        </div>

    </div>





    <!-- ================================================= -->
    <!--                    ROOM SCREEN                     -->
    <!-- ================================================= -->
    <div id="screen-room" class="screen hidden">

        <div class="window">

            <h2 class="room-title">
                Room Lobby
            </h2>

            <div class="room-info">

                <div>
                    Room ID:
                    <span id="roomIdText">----</span>
                </div>

                <div>
                    Players:
                    <span id="playerCountText">0</span>
                </div>

            </div>

            <!-- Player List -->
            <div
                id="playerList"
                class="player-list"
            >

                <!-- Example -->
                <!--
                <div class="player-card">
                    Alice
                </div>
                -->

            </div>

            <!-- Ready -->
            <div class="room-actions">

                <button id="readyBtn">
                    Ready Up
                </button>

                <button id="leaveRoomBtn">
                    Leave Room
                </button>

            </div>

            <!-- Room Status -->
            <div
                id="roomStatus"
                class="status"
            >
                Waiting for players...
            </div>

        </div>

    </div>





    <!-- ================================================= -->
    <!--                    GAME SCREEN                     -->
    <!-- ================================================= -->
    <div id="screen-game" class="screen hidden">

        <!-- Top Bar -->
        <div class="game-bar">

            <div class="bar-left">
                SPADER-MAN♠
            </div>

            <div
                id="turnText"
                class="bar-center"
            >
                Waiting for turn...
            </div>

            <div class="bar-right">

                Room:
                <span id="gameRoomId">
                    ----
                </span>

            </div>

        </div>

        <!-- Table -->
        <div class="table-area">

            <!-- Opponents -->
            <div
                id="opponents"
                class="opponents"
            >

                <!-- dynamically rendered -->

            </div>

            <!-- Center Pile -->
            <div class="pile-area">

                <div class="pile-label">
                    Current Trick
                </div>

                <div
                    id="pile"
                    class="pile"
                >

                    <!-- cards rendered here -->

                </div>

            </div>

        </div>

        <!-- Player Hand -->
        <div class="hand-area">

            <div class="hand-label">
                Your Hand
            </div>

            <div
                id="hand"
                class="hand"
            >

                <!-- player cards -->

            </div>

        </div>

    </div>





    <!-- ================================================= -->
    <!--                     END SCREEN                     -->
    <!-- ================================================= -->
    <div id="screen-end" class="screen hidden">

        <div class="window">

            <div class="logo">
                ♠
            </div>

            <h2 id="endTitle">
                Game Over
            </h2>

            <p id="endMessage">
                Winner: ---
            </p>

            <button id="playAgainBtn">
                Back To Lobby
            </button>

        </div>

    </div>

</div>

<script src="/assets/ws_test.js"></script>
<div id="toast" class="toast hidden"></div>
</body>
</html>
